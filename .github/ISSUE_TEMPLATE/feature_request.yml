name: "💡 Sugestão de Funcionalidade"
description: "Sugira uma nova ideia, atalho, preset ou melhoria para o VELOCE."
title: "[FEAT]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Ideias e sugestões da comunidade são muito bem-vindas para enriquecer o **VELOCE**!

  - type: textarea
    id: problem
    attributes:
      label: "Qual necessidade ou problema essa ideia resolve?"
      description: "Ex: 'Sinto falta de ver o waveform de áudio na timeline para achar onde atirei sem precisar pausar...'"
      placeholder: "Descreva a motivação da funcionalidade..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: "Solução Desejada"
      description: "Como você imagina o funcionamento ideal da ferramenta?"
      placeholder: "Ex: Adicionar uma faixa visual abaixo do slider com as ondas de áudio do microfone..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "Alternativas Consideradas"
      description: "Você já viu esse recurso em outros softwares como Avidemux, LosslessCut ou Premiere?"
      placeholder: "Ex: No LosslessCut existe uma opção 'Capture audio waveform'..."
